    <path d="M59 86 L59 66 C59 55 68 46 80 46 C92 46 101 55 101 66 L101 86" stroke-width="1.1"/>
    <path d="M62 86 L62 67 C62 57 70 49 80 49 C90 49 98 57 98 67 L98 86" stroke-width="0.6"/>
