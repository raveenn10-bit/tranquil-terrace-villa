    <line x1="57" y1="65" x2="64" y2="65" stroke-width="1.2"/>
    <line x1="96" y1="65" x2="103" y2="65" stroke-width="1.2"/>
    <line x1="57" y1="86" x2="64" y2="86" stroke-width="1.2"/>
    <line x1="96" y1="86" x2="103" y2="86" stroke-width="1.2"/>

