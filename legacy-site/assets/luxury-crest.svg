    <path d="M80 38 C66 38 53 49 53 66 L53 114 C53 131 66 145 80 151 C94 145 107 131 107 114 L107 66 C107 49 94 38 80 38 Z" stroke-width="0.7" stroke-dasharray="2 1.5"/>

